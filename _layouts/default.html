<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="header">
        {% include header.html %}
    </header>
    <main id="main-content">
        {{ content }}
    </main>
    {% include footer.html %}
    <script defer src="{{ site.baseurl }}/assets/js/scripts.js"></script>
</body>

</html>
