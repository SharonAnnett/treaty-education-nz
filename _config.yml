# ---------------------------
# Site Information
# ---------------------------
title: Treaty Education
description: >
  Treaty education workshops by Sharon Annett - understanding Te Tiriti o Waitangi
  in today's Aotearoa. Personal, professional, and community transformation.
lang: en-NZ
author: Sharon Annett

# ---------------------------
# URL Configuration
# ---------------------------
baseurl: ""                          # Blank for root domain deployment
url: "https://treatyeducation.co.nz" # Production domain (GitHub Pages custom domain)

# ---------------------------
# Build Settings
# ---------------------------
incremental: true                    # Faster rebuilds during development (only changed files)

# ---------------------------
# Plugins
# ---------------------------
plugins:
  - jekyll-sitemap    # Generates sitemap.xml for search engines
  - jekyll-seo-tag    # Adds SEO & Open Graph meta tags for social sharing

# ---------------------------
# Social Sharing (Open Graph / Social Cards)
# ---------------------------
logo: /assets/images/round-logo.png
image: /assets/images/small-banner.png      # Default social preview image
twitter:
  card: summary_large_image                 # Use large image card on Twitter/X

# Apply default front matter to all pages so jekyll-seo-tag always has an image
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/small-banner.png
  - scope:
      path: "404.html"
    values:
      sitemap: false
      noindex: true

# ---------------------------
# Exclude from build
# ---------------------------
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - run.bat
  - vendor
  - .jekyll-cache
  - .jekyll-metadata
  - node_modules
  - package.json
  - package-lock.json